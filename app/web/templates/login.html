{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="container py-4 py-md-5">
    <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Вход в систему</h2>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email *</label>
                        <input type="email"
                               class="form-control"
                               id="email"
                               required
                               placeholder="example@mail.ru">
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Пароль *</label>
                        <input type="password"
                               class="form-control"
                               id="password"
                               required
                               placeholder="Введите пароль">
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            Войти
                        </button>
                    </div>
                    <div class="text-center mt-3">
                        <small class="text-muted">
                            Нет аккаунта?
                            <a href="/register" class="text-decoration-none">Зарегистрироваться</a>
                        </small>
                    </div>
                </form>

                <div id="message" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const loginData = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
    };

    if (!loginData.email || !loginData.password) {
        showMessage('Заполните все поля', 'danger');
        return;
    }

    const submitBtn = document.querySelector('#loginForm button[type="submit"]');
    const originalBtnText = submitBtn.innerHTML;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Вход...';
    submitBtn.disabled = true;

    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(loginData),
            credentials: 'include'
        });

        if (response.ok) {
            showMessage('Успешный вход! Перенаправление...', 'success');

            setTimeout(() => {
                window.location.href = '/';
            }, 1000);
        } else {
            const error = await response.json();
            showMessage(error.detail || 'Ошибка входа', 'danger');
        }
    } catch (error) {
        showMessage('Ошибка сети: ' + error.message, 'danger');
    } finally {
        submitBtn.innerHTML = originalBtnText;
        submitBtn.disabled = false;
    }
});

function showMessage(text, type) {
    const div = document.getElementById('message');
    div.className = `alert alert-${type} alert-dismissible fade show`;
    div.innerHTML = `
        ${text}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
    `;
    if (type === 'success') {
        setTimeout(() => {
            const alert = bootstrap.Alert.getOrCreateInstance(div);
            alert.close();
        }, 3000);
    }
}
</script>
{% endblock %}
