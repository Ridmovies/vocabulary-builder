<!-- templates/typing_exercise.html -->
{% extends "base.html" %}

{% block title %}Упражнения на набор текста{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="mb-4">Упражнение на письмо</h1>

            <!-- Фильтры -->
            <div class="card mb-4">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Фильтры</h5>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="category-select" class="form-label">Категория</label>
                            <select class="form-select" id="category-select">
                                <option value="">Все категории</option>
                                <!-- Категории загружаются динамически -->
                            </select>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check mt-4 pt-2">
                                <input class="form-check-input" type="checkbox" id="favorite-checkbox">
                                <label class="form-check-label" for="favorite-checkbox">
                                    Только избранные слова
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="button" class="btn btn-primary" id="apply-filters-btn">
                            Применить фильтры
                        </button>
                    </div>
                </div>
            </div>

            <!-- Упражнение -->
            <div class="card mb-4">
                <div class="card-header bg-info bg-opacity-10">
                    <h5 class="mb-0">Задание</h5>
                </div>
                <div class="card-body">
                    <div id="exercise-container" class="mb-4">
                        <p class="lead">Загрузка слова...</p>
                    </div>

                    <div class="input-group mb-3">
                        <input type="text"
                               class="form-control"
                               id="answer-input"
                               placeholder="Введите английское слово"
                               autocomplete="off">
                        <button class="btn btn-success" type="button" id="check-btn">
                            Проверить
                        </button>
                    </div>

                    <!-- Сообщение о результате -->
                    <div id="feedback" class="alert" style="display: none;"></div>
                </div>
            </div>

            <!-- Статистика (опционально) -->
            <div class="card">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Статистика</h5>
                </div>
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col-md-4">
                            <h3 id="correct-count">0</h3>
                            <p class="text-muted">Правильно</p>
                        </div>
                        <div class="col-md-4">
                            <h3 id="incorrect-count">0</h3>
                            <p class="text-muted">Неправильно</p>
                        </div>
                        <div class="col-md-4">
                            <h3 id="total-count">0</h3>
                            <p class="text-muted">Всего попыток</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentWordId = null;
    let selectedCategoryId = null;
    let favoriteOnly = false;

    // Статистика
    let stats = {
        correct: 0,
        incorrect: 0,
        total: 0
    };

    async function loadCategories() {
        try {
            // Загружаем список категорий пользователя
            const response = await fetch('/api/categories?scope=all');

            if (!response.ok) {
                throw new Error('Ошибка загрузки категорий');
            }

            const categories = await response.json();
            const select = document.getElementById('category-select');

            // Сохраняем первый option
            const firstOption = select.options[0];
            select.innerHTML = '';
            select.appendChild(firstOption);

            // Добавляем категории
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat.id;
                option.textContent = cat.name;
                if (cat.owner_id) {
                    option.textContent += ' (моя)';
                }
                select.appendChild(option);
            });

            return true;
        } catch (error) {
            console.error('Ошибка:', error);
            showFeedback('Не удалось загрузить категории', 'danger');
            return false;
        }
    }

    async function loadRandomWord() {
        try {
            let url = '/api/words/random?';

            if (selectedCategoryId) {
                url += `category_ids=${selectedCategoryId}&`;
            }
            if (favoriteOnly) {
                url += `is_favorite=true&`;
            }

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error('Не удалось загрузить слово');
            }

            const word = await response.json();
            currentWordId = word.id;

            const container = document.getElementById('exercise-container');
            container.innerHTML = `
                <div class="mb-3">
                    <h4>Переведите на английский:</h4>
                    <p class="display-6 text-primary">${word.russian}</p>
                </div>
            `;

            // Очищаем поле ввода и фокус
            const input = document.getElementById('answer-input');
            input.value = '';
            input.classList.remove('is-valid', 'is-invalid');
            input.focus();

            // Скрываем предыдущий фидбек
            hideFeedback();

        } catch (error) {
            console.error('Ошибка:', error);
            showFeedback('Ошибка загрузки слова. Попробуйте снова.', 'danger');
        }
    }

    async function checkAnswer() {
        const answer = document.getElementById('answer-input').value.trim();

        if (!answer) {
            showFeedback('Введите ответ', 'warning');
            return;
        }

        try {
            const response = await fetch('/api/words/check', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({word_id: currentWordId, answer})
            });

            const result = await response.json();
            const input = document.getElementById('answer-input');

            // Обновляем статистику
            stats.total++;
            document.getElementById('total-count').textContent = stats.total;

            if (result.correct) {
                stats.correct++;
                document.getElementById('correct-count').textContent = stats.correct;

                input.classList.remove('is-invalid');
                input.classList.add('is-valid');
                showFeedback('✅ Отлично! Правильно!', 'success');
            } else {
                stats.incorrect++;
                document.getElementById('incorrect-count').textContent = stats.incorrect;

                input.classList.remove('is-valid');
                input.classList.add('is-invalid');
                showFeedback(`❌ Неверно! Правильный ответ: <strong>${result.correct_word}</strong>`, 'danger');
            }

            // Автоматически загружаем следующее слово через 1.5 секунды
            setTimeout(() => {
                loadRandomWord();
            }, 1500);

        } catch (error) {
            console.error('Ошибка:', error);
            showFeedback('Ошибка проверки ответа', 'danger');
        }
    }

    function showFeedback(message, type) {
        const feedback = document.getElementById('feedback');
        feedback.innerHTML = message;
        feedback.className = `alert alert-${type} alert-dismissible fade show`;
        feedback.style.display = 'block';

        // Добавляем кнопку закрытия
        if (!feedback.querySelector('.btn-close')) {
            const closeBtn = document.createElement('button');
            closeBtn.type = 'button';
            closeBtn.className = 'btn-close';
            closeBtn.setAttribute('data-bs-dismiss', 'alert');
            closeBtn.setAttribute('aria-label', 'Закрыть');
            feedback.appendChild(closeBtn);
        }
    }

    function hideFeedback() {
        const feedback = document.getElementById('feedback');
        feedback.style.display = 'none';
    }

    // Обработчики событий
    document.getElementById('check-btn').addEventListener('click', checkAnswer);

    document.getElementById('answer-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });

    document.getElementById('apply-filters-btn').addEventListener('click', () => {
        selectedCategoryId = document.getElementById('category-select').value || null;
        favoriteOnly = document.getElementById('favorite-checkbox').checked;
        loadRandomWord();
    });

    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', async () => {
        // Загружаем категории
        await loadCategories();

        // Загружаем первое слово
        await loadRandomWord();

        // Фокус на поле ввода
        document.getElementById('answer-input').focus();
    });
</script>
{% endblock %}
