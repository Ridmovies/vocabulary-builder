<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Typing Exercise</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #exercise-container { margin-bottom: 10px; }
        input, select { padding: 5px; width: 200px; margin-right: 10px; }
        button { padding: 5px 10px; }
        .correct { border: 2px solid green; }
        .incorrect { border: 2px solid red; }
    </style>
</head>
<body>
    <h1>Упражнение на письмо</h1>

    <!-- Фильтры -->
    <div id="filters">
        <label>
            Категория:
            <select id="category-select">
                <option value="">Все</option>
            </select>
        </label>
        <label>
            <input type="checkbox" id="favorite-checkbox">
            Только избранное
        </label>
        <button id="apply-filters-btn">Применить фильтры</button>
    </div>

    <hr>

    <div id="exercise-container">
        <!-- Сюда подгружается слово -->
    </div>

    <input type="text" id="answer-input" placeholder="Введите английское слово">
    <button id="check-btn">Проверить</button>

    <p id="feedback"></p>

    <script>
        let currentWordId = null;
        let selectedCategoryId = null;
        let favoriteOnly = false;

        async function loadCategories() {
            // Загружаем список категорий с сервера
            const response = await fetch('/api/categories');
            const categories = await response.json();

            const select = document.getElementById('category-select');
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat.id;
                option.textContent = cat.name;
                select.appendChild(option);
            });
        }

        async function loadRandomWord() {
            let url = '/api/typing/random?';

            if (selectedCategoryId) {
                url += `category_ids=${selectedCategoryId}&`;
            }
            if (favoriteOnly) {
                url += `is_favorite=true&`;
            }

            const response = await fetch(url);
            const word = await response.json();

            currentWordId = word.id;

            const container = document.getElementById('exercise-container');
            container.innerHTML = `
                <p>Перевод: <strong>${word.russian}</strong></p>
                <p>Длина английского слова: ${word.english.length} букв</p>
                <p>Категории: ${word.categories.map(c => c.name).join(', ')}</p>
            `;

            const input = document.getElementById('answer-input');
            input.value = '';
            input.className = '';
            input.focus();
            document.getElementById('feedback').textContent = '';
        }

        async function checkAnswer() {
            const answer = document.getElementById('answer-input').value;

            const response = await fetch('/api/typing/check', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({word_id: currentWordId, answer})
            });

            const result = await response.json();
            const input = document.getElementById('answer-input');
            const feedback = document.getElementById('feedback');

            if (result.correct) {
                input.className = 'correct';
                feedback.textContent = 'Верно!';
            } else {
                input.className = 'incorrect';
                feedback.textContent = `Неверно! Правильный ответ: ${result.correct_word}`;
            }

            setTimeout(() => loadRandomWord(), 1500);
        }

        document.getElementById('check-btn').addEventListener('click', checkAnswer);

        document.getElementById('apply-filters-btn').addEventListener('click', () => {
            selectedCategoryId = document.getElementById('category-select').value || null;
            favoriteOnly = document.getElementById('favorite-checkbox').checked;
            loadRandomWord();
        });

        // Инициализация страницы
        loadCategories().then(() => loadRandomWord());
    </script>
</body>
</html>
